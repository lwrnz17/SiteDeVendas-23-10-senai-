<main class="pagina-login">
  <section class="cartao-login">
    <div class="login-marca"><img src="assets/img/logo.png" alt="Lorenzo Games"><span>LORENZO <strong>GAMES</strong></span></div>
    <span class="sobretitulo">BOM TER VOCÊ AQUI</span>
    <h1>Entre na sua conta</h1>
    <p class="subtitulo">Acesse sua área gamer para continuar.</p>

    <form (submit)="entrar($event)">
      <label for="email">E-mail ou usuário</label>
      <input id="email" name="email" type="text" autocomplete="username" placeholder="Digite seu e-mail ou usuário" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>

      <button type="submit">Entrar na conta <span aria-hidden="true">→</span></button>
      <p class="mensagem-login" *ngIf="mensagem" role="status">{{ mensagem }}</p>
    </form>
    <p class="nota-login">Projeto demonstrativo: a autenticação ainda não está conectada a um servidor.</p>
    <a routerLink="/inicio" class="voltar">← Voltar para a loja</a>
  </section>
</main>
